name: daily-finpress
on:
  schedule:
    - cron: "30 23 * * 0-4"   # UTC 23:30 = 北京时间次日 7:30（周一~周五）
  workflow_dispatch:          # 允许手动触发（Actions 页面 → 右侧 Run workflow）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: 抓取行情数据
        run: python fetch_data.py
      - name: 生成公众号文章
        run: python generate.py
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      - name: 保存文章（在运行记录底部 Download artifacts 下载）
        uses: actions/upload-artifact@v4
        with:
          name: article
          path: article_*.md
